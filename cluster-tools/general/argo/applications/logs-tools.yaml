apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: logging-tools
  namespace: argocd
spec:
  project: default

  destination:
    server: https://kubernetes.default.svc
    namespace: logging

  sources:
    - repoURL: https://github.com/ViniciusPilan/metrics-setup-of-dreams.git
      targetRevision: v1
      ref: values

    # Loki
    - repoURL: grafana-community.github.io/helm-charts
      chart: loki
      targetRevision: 6.41.0
      helm:
        # releaseName: grafana
        valueFiles:
          - $values/cluster-tools/logging/loki/values.yaml

  # Loki


  syncPolicy:
    syncOptions:
      - CreateNamespace=true
