# Ref: https://github.com/rajsinghtech/garage-operator/blob/main/charts/garage-operator/values.yaml

# Default values for garage-operator
# This is a YAML-formatted file.

# -- Number of operator replicas (typically 1 with leader election)
replicaCount: 1

fullnameOverride: "garage"

image:
  # -- Container image repository
  repository: ghcr.io/rajsinghtech/garage-operator
  # -- Image pull policy
  pullPolicy: IfNotPresent
  # -- Overrides the image tag (default is the chart appVersion)
  tag: ""

serviceAccount:
  create: true

# Pod security context
podSecurityContext:
  # -- Run as non-root user
  runAsNonRoot: true
  # -- Seccomp profile type
  seccompProfile:
    type: RuntimeDefault

# Container security context
securityContext:
  # -- Read-only root filesystem
  readOnlyRootFilesystem: true
  # -- Disallow privilege escalation
  allowPrivilegeEscalation: false
  # -- Drop all capabilities
  capabilities:
    drop:
      - "ALL"

# Resource requests and limits
# Note: 256Mi is recommended for stable operation. Lower values (128Mi) may cause
# OOM issues during certificate generation or when managing many resources.
resources:
  limits:
    cpu: 500m
    memory: 256Mi
  requests:
    cpu: 10m
    memory: 128Mi

# Leader election configuration
leaderElection:
  # -- Enable leader election for HA deployments
  enabled: true

# Health probes configuration
livenessProbe:
  httpGet:
    path: /healthz
    port: 8081
  initialDelaySeconds: 15
  periodSeconds: 20

readinessProbe:
  httpGet:
    path: /readyz
    port: 8081
  initialDelaySeconds: 5
  periodSeconds: 10

# Metrics configuration
metrics:
  # -- Enable metrics endpoint
  enabled: true
  # -- Metrics bind address (port)
  bindAddress: ":8443"
  service:
    # -- Create metrics service
    enabled: true
    # -- Metrics service type
    type: ClusterIP
    # -- Metrics service port
    port: 8443

# ServiceMonitor for Prometheus Operator
serviceMonitor:
  # -- Create ServiceMonitor resource
  enabled: true
  # -- Additional labels for ServiceMonitor
  labels: {}
  # -- Metrics scrape interval
  interval: 30s
  # -- Metrics scrape timeout
  scrapeTimeout: 10s
  # -- Use HTTPS for scraping
  scheme: https
  # -- TLS configuration for metrics endpoint
  tlsConfig:
    insecureSkipVerify: true
  # -- Namespace for ServiceMonitor (defaults to release namespace)
  namespace: ""

# Grafana dashboard ConfigMap for the official Garage Prometheus dashboard.
# Uses the Grafana sidecar pattern — label the ConfigMap so Grafana auto-discovers it.
grafanaDashboard:
  # -- Create a ConfigMap containing the Garage Grafana dashboard JSON.
  enabled: false
  # -- Labels added to the ConfigMap. Set to match your Grafana sidecar's discovery label.
  labels:
    grafana_dashboard: "1"

# PrometheusRules for alerting on GarageCluster health
prometheusRules:
  # -- Create PrometheusRule resources with Garage alerting rules.
  # Requires prometheus-operator to be installed.
  enabled: false

# Network policy configuration
networkPolicy:
  # -- Create NetworkPolicy to protect metrics endpoint
  enabled: false
  # -- Label selector for namespaces allowed to access metrics
  allowedNamespaceSelector:
    matchLabels:
      metrics: enabled


# CRD installation
crds:
  # -- Install CRDs with Helm
  install: true
  # -- Keep CRDs on chart uninstall
  keep: true

# RBAC configuration
rbac:
  # -- Create RBAC resources
  create: true

# -- Operator log level. Valid values: debug, info, error.
# warn/warning are accepted as aliases and silently mapped to error —
# controller-runtime's zap logger does not expose a warn level as a named string.
# Note: positive integers are V-levels (more verbose), not severity levels.
# Maps to --zap-log-level flag (controller-runtime zap logger).
logLevel: info

# -- Extra Kubernetes objects to deploy with the chart (supports templating)
extraObjects: 
  - apiVersion: garage.rajsingh.info/v1alpha1
    kind: GarageCluster
    metadata:
      name: garage-cluster
    spec:
      replicas: 3
      replication:
        factor: 3
      zone: us-east-1
      storage:
        data:
          size: 10Gi

  - apiVersion: garage.rajsingh.info/v1alpha1
    kind: GarageBucket
    metadata:
      name: mimir-metrics
    spec:
      clusterRef:
        name: garage-cluster

  - apiVersion: garage.rajsingh.info/v1alpha1
    kind: GarageKey
    metadata:
      name: mimir-key
    spec:
      clusterRef:
        name: garage-cluster
      bucketPermissions:
        - bucketRef: mimir-metrics
          read: true
          write: true
