# https://github.com/strimzi/strimzi-kafka-operator/blob/0.51.0/examples/topic/kafka-topic.yaml
apiVersion: kafka.strimzi.io/v1
kind: KafkaTopic
metadata:
  name: mimir-topic
  labels:
    strimzi.io/cluster: mimir-kafka
spec:
  partitions: 3
  replicas: 1
  config:
    retention.ms: 7200000
    segment.bytes: 1073741824
