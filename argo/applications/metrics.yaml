apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: metrics-tools
  namespace: argocd
spec:
  project: default

  destination:
    server: https://kubernetes.default.svc
    namespace: metrics

  sources:
    - repoURL: https://github.com/ViniciusPilan/metrics-setup-of-dreams.git
      targetRevision: v1
      ref: values
    
    # Mimir
    # - repoURL: https://grafana.github.io/helm-charts
    #   chart: mimir-distributed
    #   targetRevision: 6.0.6
    #   helm:
    #     valueFiles:
    #       - $values/mimir/values.yaml

    # Grafana
    - repoURL: ghcr.io/grafana-community/helm-charts
      chart: grafana
      targetRevision: 12.1.1
      helm:
        releaseName: grafana
        valueFiles:
          - $values/grafana/values.yaml

    # Prometheus
    - repoURL: ghcr.io/prometheus-community/charts
      chart: kube-prometheus-stack
      targetRevision: 83.6.0
      helm:
        valueFiles:
          - $values/prometheus/base.yaml
          - $values/prometheus/values.yaml

    # Prometheus Operator
    - repoURL: ghcr.io/prometheus-community/charts
      chart: kube-prometheus-stack
      targetRevision: 83.6.0
      helm:
        # releaseName: prometheus
        valueFiles:
          - $values/prometheus-operator/base.yaml
          - $values/prometheus-operator/values.yaml

  syncPolicy:
    # automated:
    #   prune: true
    #   selfHeal: true
    syncOptions:
      - CreateNamespace=true
